<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <g stroke="rgba(255, 255, 255, 0.065)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1. SpaceMR Rocket (top left) -->
    <g transform="translate(35, 30) rotate(-25)">
      <path d="M14 0c7 5 12 14 12 24v8l-12-6-12 6v-8c0-10 5-19 12-24z"/>
      <circle cx="14" cy="16" r="3.5"/>
      <path d="M2 32l-6 8 8-2M26 32l6 8-8-2"/>
      <path d="M10 38c2 4 4 6 4 6s2-2 4-6"/>
    </g>

    <!-- 2. Crescent Moon & Stars (top center) -->
    <g transform="translate(195, 25)">
      <path d="M18 4a14 14 0 1 0 10 21 12 12 0 0 1-10-21z"/>
      <!-- Tiny star -->
      <path d="M28 8v4M26 10h4" stroke-width="1.2"/>
    </g>

    <!-- 3. Paper Airplane (top right) -->
    <g transform="translate(325, 40) rotate(15)">
      <path d="M0 0l28 14-28 14 6-14L0 0z"/>
      <path d="M6 14l12 0"/>
    </g>

    <!-- 4. Headphones (upper-mid left) -->
    <g transform="translate(45, 125)">
      <path d="M4 18a14 14 0 0 1 28 0"/>
      <rect x="0" y="16" width="6" height="12" rx="3"/>
      <rect x="30" y="16" width="6" height="12" rx="3"/>
      <!-- Audio waves -->
      <path d="M-6 22c-1-2-1-4 0-6M42 22c1-2 1-4 0-6" stroke-width="1.2"/>
    </g>

    <!-- 5. Saturn / Ringed Planet (center-left) -->
    <g transform="translate(130, 110) rotate(-18)">
      <circle cx="20" cy="18" r="11"/>
      <ellipse cx="20" cy="18" rx="22" ry="6"/>
    </g>

    <!-- 6. Steaming Coffee / Tea Cup (center) -->
    <g transform="translate(235, 125)">
      <path d="M6 10h18v10a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8V10z"/>
      <path d="M24 13h3a3 3 0 0 1 0 6h-3"/>
      <!-- Steam -->
      <path d="M11 2c1 2-1 4 0 6M15 1c1 2-1 4 0 6M19 2c1 2-1 4 0 6" stroke-width="1.2"/>
      <path d="M4 31h22"/>
    </g>

    <!-- 7. Chat Bubble (mid-right) -->
    <g transform="translate(330, 135)">
      <path d="M4 4h22a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-14l-8 6v-6H4a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z"/>
      <circle cx="10" cy="14" r="1.5" fill="rgba(255,255,255,0.065)"/>
      <circle cx="15" cy="14" r="1.5" fill="rgba(255,255,255,0.065)"/>
      <circle cx="20" cy="14" r="1.5" fill="rgba(255,255,255,0.065)"/>
    </g>

    <!-- 8. Code Brackets (lower-center left) -->
    <g transform="translate(45, 220)">
      <path d="M12 4L4 12l8 8M20 4l8 8-8 8M18 2l-4 20" stroke-width="1.4"/>
    </g>

    <!-- 9. Retro Gamepad (center-mid) -->
    <g transform="translate(140, 205)">
      <rect x="0" y="6" width="32" height="18" rx="6"/>
      <!-- D-pad -->
      <path d="M6 15h6M9 12v6" stroke-width="1.3"/>
      <!-- Buttons -->
      <circle cx="23" cy="13" r="1.5" fill="rgba(255,255,255,0.065)"/>
      <circle cx="26" cy="17" r="1.5" fill="rgba(255,255,255,0.065)"/>
    </g>

    <!-- 10. UFO Flying Saucer (center-right) -->
    <g transform="translate(250, 215)">
      <ellipse cx="16" cy="12" rx="16" ry="6"/>
      <path d="M10 10a6 6 0 0 1 12 0"/>
      <!-- Light beam -->
      <path d="M7 16l-4 12M25 16l4 12" stroke-dasharray="2 2" stroke-width="1.1"/>
    </g>

    <!-- 11. Heart with Calm Pulse (lower right) -->
    <g transform="translate(340, 225)">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </g>

    <!-- 12. Peaceful Plant Leaf (bottom left) -->
    <g transform="translate(40, 310) rotate(-10)">
      <path d="M4 26C4 26 6 12 20 6c0 0-2 14-16 20z"/>
      <path d="M4 26c4-6 9-11 16-20" stroke-width="1.2"/>
      <path d="M2 28c2-1 4-2 6-2"/>
    </g>

    <!-- 13. Lightbulb (bottom center-left) -->
    <g transform="translate(135, 305)">
      <path d="M12 2a9 9 0 0 0-6 15c1 1.5 2 3.5 2 5h8c0-1.5 1-3.5 2-5a9 9 0 0 0-6-15z"/>
      <path d="M9 26h6M10 29h4"/>
      <!-- Filament glow -->
      <path d="M12 7v5" stroke-width="1.2"/>
    </g>

    <!-- 14. Orbital Satellite (bottom center) -->
    <g transform="translate(225, 315) rotate(20)">
      <rect x="10" y="6" width="10" height="12" rx="2"/>
      <path d="M0 8h10M20 8h10M0 16h10M20 16h10"/>
      <path d="M2 6v12M28 6v12"/>
      <circle cx="15" cy="2" r="2"/>
    </g>

    <!-- 15. Music Note (bottom center-right) -->
    <g transform="translate(305, 315)">
      <circle cx="6" cy="18" r="4"/>
      <circle cx="22" cy="14" r="4"/>
      <path d="M10 18V4l16-4v14"/>
      <path d="M10 9l16-4"/>
    </g>

    <!-- 16. Peaceful Envelope (bottom right) -->
    <g transform="translate(345, 325)">
      <rect x="0" y="0" width="24" height="16" rx="3"/>
      <path d="M0 0l12 9 12-9"/>
    </g>

    <!-- Ambient Sparkles, 4-point Stars & Constellation Dust (Fill Empty Voids) -->
    <!-- Top area -->
    <path d="M115 45l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" stroke-width="1.1"/>
    <circle cx="155" cy="55" r="1" fill="rgba(255,255,255,0.065)"/>
    <circle cx="280" cy="35" r="1.2" fill="rgba(255,255,255,0.065)"/>
    <path d="M260 65l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" stroke-width="1"/>

    <!-- Mid-upper area -->
    <circle cx="95" cy="165" r="1" fill="rgba(255,255,255,0.065)"/>
    <path d="M20 190l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" stroke-width="1"/>
    <circle cx="195" cy="175" r="1.3" fill="rgba(255,255,255,0.065)"/>
    <path d="M295 185l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" stroke-width="1.1"/>
    <circle cx="385" cy="95" r="1" fill="rgba(255,255,255,0.065)"/>

    <!-- Mid-lower area -->
    <circle cx="105" cy="275" r="1.2" fill="rgba(255,255,255,0.065)"/>
    <path d="M205 270l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" stroke-width="1"/>
    <circle cx="310" cy="265" r="1" fill="rgba(255,255,255,0.065)"/>
    <path d="M380 280l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" stroke-width="1"/>

    <!-- Bottom corners -->
    <circle cx="15" cy="365" r="1.2" fill="rgba(255,255,255,0.065)"/>
    <circle cx="95" cy="380" r="1" fill="rgba(255,255,255,0.065)"/>
    <path d="M185 375l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" stroke-width="1.1"/>
    <circle cx="270" cy="385" r="1" fill="rgba(255,255,255,0.065)"/>
    <circle cx="380" cy="385" r="1.2" fill="rgba(255,255,255,0.065)"/>
