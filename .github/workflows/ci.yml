name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: store-policy
        run: node tests/store-policy.mjs
      - name: flags
        run: node tests/flags.mjs
        continue-on-error: true
      - name: secret patterns (basic)
        run: |
          if git grep -nE 'sk_live_[A-Za-z0-9]+|BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|sb_secret_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|SUPABASE_SERVICE_ROLE(_KEY)?["'\'' :=]+[A-Za-z0-9._-]{30,}' -- '*.js' '*.mjs' '*.html' '*.json' '*.ts' '*.sql' ':!modules/vendor/*' ':!package-lock.json'; then
            echo 'Possible secret pattern found' >&2
            exit 1
          fi
          echo 'OK: no obvious secrets in tracked sources'
