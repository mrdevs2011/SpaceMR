<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>404 · SpaceMR</title>
<link rel="icon" type="image/png" href="/svg/favicon.png">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #000000;
  --text: #e7e9ea;
  --muted: #71767b;
  --line: #2f3336;
  --blue: #1d9bf0;
}

html, body { height: 100%; background: var(--bg); }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  text-align: center;
  overflow: hidden;
  position: relative;
}

/* Yulduzlar — juda mayin, faqat fon */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 12% 22%, rgba(231, 233, 234, 0.5), transparent),
    radial-gradient(1px 1px at 78% 14%, rgba(231, 233, 234, 0.5), transparent),
    radial-gradient(1.5px 1.5px at 88% 68%, rgba(231, 233, 234, 0.5), transparent),
    radial-gradient(1px 1px at 22% 78%, rgba(231, 233, 234, 0.2), transparent),
    radial-gradient(1px 1px at 55% 88%, rgba(231, 233, 234, 0.5), transparent),
    radial-gradient(1px 1px at 40% 10%, rgba(231, 233, 234, 0.2), transparent),
    radial-gradient(1.5px 1.5px at 6% 58%, rgba(231, 233, 234, 0.5), transparent),
    radial-gradient(1px 1px at 94% 38%, rgba(231, 233, 234, 0.2), transparent);
  pointer-events: none;
}

main {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 360px;
}

/* 404 + aylanuvchi nuqta (orbita) */
.code {
  position: relative;
  display: grid;
  place-items: center;
  width: 220px;
  height: 220px;
  margin-bottom: 8px;
}
.code::before {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
}
.orbit {
  position: absolute;
  inset: 0;
  animation: spin 14s linear infinite;
}
.orbit::after {
  content: "";
  position: absolute;
  top: -4px;
  left: calc(50% - 4px);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 14px 2px rgba(29, 155, 240, 0.5);
}
.num {
  font-size: 64px;
  font-weight: 800;
  letter-spacing: -2px;
  line-height: 1;
  color: var(--text);
  user-select: none;
}

h1 {
  font-size: 22px;
  font-weight: 700;
  margin-top: 12px;
}
p {
  font-size: 15px;
  line-height: 1.5;
  color: var(--muted);
  margin-top: 8px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 28px;
  height: 44px;
  padding: 0 28px;
  border-radius: 999px;
  background: #e7e9ea;
  color: #000000 !important;
  font-size: 15px;
  font-weight: 700;
  text-decoration: none;
  transition: opacity .15s ease, transform .15s ease;
}
.btn:link,
.btn:visited,
.btn:hover,
.btn:active {
  color: #000000 !important;
  text-decoration: none;
}
.btn:hover { opacity: .88; }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

.brand {
  position: absolute;
  bottom: max(20px, env(safe-area-inset-bottom, 0px));
  left: 0; right: 0;
  z-index: 1;
  font-size: 12px;
  letter-spacing: .02em;
  color: var(--muted);
  opacity: .6;
}

@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }
</style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">
      <div class="orbit"></div>
      <div class="num">404</div>
    </div>
    <h1>Sahifa topilmadi</h1>
    <p>Bu manzil mavjud emas yoki boshqa joyga ko'chirilgan.</p>
    <a class="btn" href="/">Bosh sahifaga qaytish</a>
  </main>
  <div class="brand">SpaceMR</div>
</body>
</html>
