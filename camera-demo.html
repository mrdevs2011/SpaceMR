<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>SpaceMR Camera UI — 1:1</title>
<link rel="stylesheet" href="./app.css">
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  /* force visible for demo without real stream */
  #camCapture { display: flex !important; }
  #camCapture .cc-mock {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(29,155,240,0.25), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(120,80,200,0.2), transparent 45%),
      linear-gradient(160deg, #1a1f2e 0%, #0d1117 50%, #151a22 100%);
    transition: filter 0.45s ease;
  }
  #camCapture .cc-mock.front { filter: hue-rotate(38deg) brightness(1.05); }
  #camCapture .cc-mock-label {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    text-align: center; color: rgba(255,255,255,0.45); font: 500 13px/1.5 system-ui;
    pointer-events: none; z-index: 1;
  }
</style>
</head>
<body>
<div id="camCapture">
  <div class="cc-mock" id="ccMock">
    <div class="cc-mock-label">Kamera preview<br><small>SpaceMR mock</small></div>
  </div>
  <video class="cc-video" id="ccVideo" autoplay muted playsinline hidden></video>
  <img class="cc-preview-img" alt="" hidden>
  <video class="cc-preview-vid" playsinline controls hidden></video>
  <div class="cc-top">
    <button type="button" class="cc-btn cc-close" aria-label="Yopish">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="cc-top-center">
      <div class="cc-modes">
        <button type="button" class="cc-mode active" data-mode="photo" aria-label="Foto">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-1.5-2h-7L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <button type="button" class="cc-mode" data-mode="video" aria-label="Video">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>
        </button>
      </div>
      <div class="cc-rec-timer" hidden><span class="cc-rec-dot"></span><span class="cc-rec-time">0:00</span></div>
    </div>
    <div class="cc-top-right">
      <button type="button" class="cc-btn cc-flip" id="ccFlip" aria-label="Kamerani almashtirish">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <g class="cc-flip-cam">
            <path d="M4.5 8.2h2.2l1.1-1.6h6.4l1.1 1.6h2.2a1.4 1.4 0 0 1 1.4 1.4v7.2a1.4 1.4 0 0 1-1.4 1.4H4.5a1.4 1.4 0 0 1-1.4-1.4v-7.2a1.4 1.4 0 0 1 1.4-1.4z"/>
            <circle cx="12" cy="12.6" r="2.7"/>
          </g>
          <g class="cc-flip-arrows">
            <circle cx="18.6" cy="5.4" r="4.1" fill="currentColor" stroke="none" opacity="0.18"/>
            <path d="M17.1 3.6a2.6 2.6 0 0 1 3.2 1.1" stroke-width="1.5"/>
            <path d="M20.3 4.2l0.1 1.5 -1.5 -0.2" stroke-width="1.5"/>
            <path d="M20.1 7.2a2.6 2.6 0 0 1-3.2-1.1" stroke-width="1.5"/>
            <path d="M16.9 6.6l-0.1-1.5 1.5 0.2" stroke-width="1.5"/>
          </g>
        </svg>
      </button>
      <button type="button" class="cc-btn cc-flash" id="ccFlash" aria-label="Fonar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 2v11h3v9l7-12h-4l4-8z"/><path d="M4 4l16 16"/></svg>
      </button>
    </div>
  </div>
  <div class="cc-bottom">
    <button type="button" class="cc-shutter" id="ccShutter" aria-label="Surat / yozish"><span class="cc-shutter-inner"></span></button>
    <div class="cc-review" hidden>
      <button type="button" class="cc-btn cc-retake" aria-label="Qayta olish">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button type="button" class="cc-btn cc-send" aria-label="Yuborish">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3.4 20.6L21 12 3.4 3.4l.1 6.8L15 12 3.5 13.8z"/></svg>
      </button>
    </div>
  </div>
</div>
<script>
const flip = document.getElementById('ccFlip');
const mock = document.getElementById('ccMock');
const modes = document.querySelector('.cc-modes');
const shutter = document.getElementById('ccShutter');
let front = false;
let mode = 'photo';

function doFlip() {
  flip.classList.remove('cc-flip-anim');
  void flip.offsetWidth;
  flip.classList.add('cc-flip-anim');
  setTimeout(() => flip.classList.remove('cc-flip-anim'), 520);
  front = !front;
  mock.classList.toggle('front', front);
}
flip.addEventListener('click', doFlip);

modes.addEventListener('click', e => {
  const b = e.target.closest('.cc-mode');
  if (!b) return;
  mode = b.dataset.mode;
  modes.querySelectorAll('.cc-mode').forEach(x => x.classList.toggle('active', x === b));
  shutter.classList.toggle('video-mode', mode === 'video');
});

// auto sequence for recording: flips every ~1.6s
const delays = [800, 1600, 1600, 1600, 1600, 1800, 1800];
let i = 0;
function tick() {
  if (i >= delays.length) return;
  setTimeout(() => { doFlip(); i++; tick(); }, delays[i]);
}
setTimeout(tick, 600);
</script>
</body>
</html>
